# Зоны, которыми можно пользоваться. Другие домены не добавлять.
# Имя записи: поле subdomain в карточке сервера плюс зона.
# Поддомен сервера создаётся на каждой зоне, если у сервера cloudflare_zones: all.
# Пример: subdomain vp22 -> vp22.sdfsdfsdfsd.store, vp22.losttv.site, vp22.linkusers3.online
# Токен Cloudflare: CLOUDFLARE_API_TOKEN в локальном .env, не здесь.

zones:
  - name: sdfsdfsdfsd.store
    dns: cloudflare
    nameservers:
      - lily.ns.cloudflare.com
      - eric.ns.cloudflare.com

  - name: losttv.site
    dns: cloudflare
    nameservers:
      - lily.ns.cloudflare.com
      - eric.ns.cloudflare.com

  - name: linkusers3.online
    dns: cloudflare
    nameservers:
      - eva.ns.cloudflare.com
      - everton.ns.cloudflare.com

  - name: telegrambot.website
    dns: cloudflare
    # доп. CDN-зоны для vp-парка (proxied)

  - name: teleworker.fun
    dns: cloudflare
    # доп. CDN-зоны для vp-парка (proxied)
