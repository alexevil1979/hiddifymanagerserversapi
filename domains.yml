# Зоны, которыми можно пользоваться. Другие домены не добавлять.
# Имя записи: поле subdomain в карточке сервера плюс зона.
# Пример: subdomain mvp22 и зона linkusers3.online -> mvp22.linkusers3.online
# Токен Cloudflare: CLOUDFLARE_API_TOKEN в локальном .env, не здесь.

zones:
  - name: sdfsdfsdfsd.store
    dns: cloudflare
    nameservers:
      - lily.ns.cloudflare.com
      - eric.ns.cloudflare.com

  - name: losttv.site
    dns: cloudflare
    nameservers:
      - lily.ns.cloudflare.com
      - eric.ns.cloudflare.com

  - name: linkusers3.online
    dns: cloudflare
    nameservers:
      - eva.ns.cloudflare.com
      - everton.ns.cloudflare.com
